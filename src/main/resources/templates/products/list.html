<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Products')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <h1>Products</h1>
    <p class="muted" th:if="${q != null}">Results for "<span th:text="${q}">term</span>"</p>

    <div th:if="${page.content.isEmpty()}" class="empty">
        <p>No products found</p>
        <a th:href="@{/products(q=${q},category=${selectedCategory},page=0,size=${page.size})}">Back to first page</a>
    </div>

    <!-- No "page" field on purpose: changing the size always starts again at the first page. -->
    <form class="page-size" th:if="${page.totalElements > 0}" th:action="@{/products}" method="get">
        <input type="hidden" name="q" th:if="${q != null}" th:value="${q}">
        <input type="hidden" name="category" th:if="${selectedCategory != null}" th:value="${selectedCategory}">
        <label for="page-size">Products per page</label>
        <select id="page-size" name="size" autocomplete="off">
            <option th:each="s : ${pageSizeOptions}" th:value="${s}" th:text="${s}"
                    th:selected="${s == page.size}">12</option>
        </select>
        <button type="submit">Apply</button>
    </form>

    <ul class="product-grid" th:unless="${page.content.isEmpty()}">
        <li class="product-card" th:each="p : ${page.content}">
            <a th:href="@{/products/{id}(id=${p.id})}">
                <img th:src="@{${p.imageUrl}}" th:alt="${p.name}" width="240" height="180">
            </a>
            <h2 class="product-name"><a th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}">Name</a></h2>
            <p class="category" th:text="${p.category.name}">Category</p>
            <p class="price" th:text="${@moneyFormatter.format(p.price)}">$0.00</p>
            <p th:if="${p.inStock}" class="stock in-stock">In stock</p>
            <p th:unless="${p.inStock}" class="stock out-of-stock">Out of stock</p>
        </li>
    </ul>

    <nav class="pagination" th:if="${page.totalPages > 1}" aria-label="Pagination">
        <a th:if="${page.hasPrevious()}"
           th:href="@{/products(q=${q},category=${selectedCategory},page=${page.number - 1},size=${page.size})}"
           class="button pagination-prev">&laquo; Previous</a>
        <span class="pagination-status" th:text="'Page ' + ${page.number + 1} + ' of ' + ${page.totalPages}">Page 1 of 1</span>
        <a th:if="${page.hasNext()}"
           th:href="@{/products(q=${q},category=${selectedCategory},page=${page.number + 1},size=${page.size})}"
           class="button pagination-next">Next &raquo;</a>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/page-size.js}"></script>
</body>
</html>
