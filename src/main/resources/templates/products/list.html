<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Products')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="list-toolbar">
        <div>
            <h1>Products</h1>
            <p class="muted" th:if="${q != null}">Results for "<span th:text="${q}">term</span>"</p>
            <p class="muted result-count" th:unless="${page.content.isEmpty()}"
               th:text="'Showing ' + ${page.number * page.size + 1} + '–' + ${page.number * page.size + page.numberOfElements}
                        + ' of ' + ${page.totalElements}">Showing 1–12 of 20</p>
        </div>
        <!-- GET form: changing the size restarts at the first page and keeps the search term and category. -->
        <form class="page-size" th:action="@{/products}" method="get">
            <input type="hidden" name="q" th:if="${q != null}" th:value="${q}">
            <input type="hidden" name="category" th:if="${selectedCategory != null}" th:value="${selectedCategory}">
            <label for="page-size">Per page</label>
            <select id="page-size" name="size">
                <option th:each="s : ${pageSizes}" th:value="${s}" th:text="${s}" th:selected="${s == size}">12</option>
            </select>
            <button type="submit" class="page-size-apply">Apply</button>
        </form>
    </div>

    <div th:if="${page.content.isEmpty()}" class="empty">
        <p>No products found</p>
        <a th:href="@{/products(q=${q},category=${selectedCategory},size=${size},page=0)}">Back to first page</a>
    </div>

    <ul class="product-grid" th:unless="${page.content.isEmpty()}">
        <li class="product-card" th:each="p : ${page.content}">
            <a th:href="@{/products/{id}(id=${p.id})}">
                <img th:src="@{${p.imageUrl}}" th:alt="${p.name}" width="240" height="180"
                     loading="lazy" decoding="async">
            </a>
            <h2 class="product-name"><a th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}">Name</a></h2>
            <p class="category" th:text="${p.category.name}">Category</p>
            <p class="price" th:text="${@moneyFormatter.format(p.price)}">$0.00</p>
            <p th:if="${p.inStock}" class="stock in-stock">In stock</p>
            <p th:unless="${p.inStock}" class="stock out-of-stock">Out of stock</p>
        </li>
    </ul>

    <nav class="pagination" th:if="${page.totalPages > 1}" aria-label="Pagination">
        <a th:if="${page.hasPrevious()}"
           th:href="@{/products(q=${q},category=${selectedCategory},size=${size},page=${page.number - 1})}">&laquo; Previous</a>
        <span th:text="'Page ' + ${page.number + 1} + ' of ' + ${page.totalPages}">Page 1 of 1</span>
        <a th:if="${page.hasNext()}"
           th:href="@{/products(q=${q},category=${selectedCategory},size=${size},page=${page.number + 1})}">Next &raquo;</a>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/products.js}" defer></script>
</body>
</html>
